apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: client-gateway
  name: client-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-gateway
  strategy: {}
  template:
    metadata:
      labels:
        app: client-gateway
    spec:
      containers:
      - image: southamerica-west1-docker.pkg.dev/store-microservice-497220/image-registry/client-gateway-prod
        name: client-gateway-prod
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: NATS_SERVERS
          value: "nats://nats"
        resources: {}
status: {}
